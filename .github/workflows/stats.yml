name: Refresh GitHub Stats

on:
  schedule:
    - cron: "17 5 * * *"   # Runs daily at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Generate GitHub Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: MiteshGorad   # <-- Replace with your GitHub username if different
        run: python3 scripts/generate_stats.py

      - name: Commit changes
        run: |
          FILES="stats.svg streak.svg langs.svg year.svg hd-*.svg"

          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- $FILES
          git commit -m "stats: refresh profile graphics"
          git push
